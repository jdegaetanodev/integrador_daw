<form [formGroup]="form">
    <div id="main">
        <h2>Clínica</h2>
        <div class="brand">
            <img src="/fcad_logo.png" alt="Logo de la clínica">
        </div>
        <p-floatlabel class="field" variant="on">
            <input pInputText id="documento" type="text" formControlName="documento"/>
            <label for="documento">Documento</label>
        </p-floatlabel>
        <p-floatlabel class="field" variant="on">
            <p-password inputId="clave" formControlName="clave" [feedback]="false" autocomplete="off" [toggleMask]="true" [fluid]="true"/>
            <label for="clave">Clave</label>
        </p-floatlabel>
        <p-button label="Iniciar sesión" (click)="iniciarSesion()"/>
    </div>
</form>
