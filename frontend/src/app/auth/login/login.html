<form [formGroup]="form">
    <div id="main">
        <h2 id="header">Clinica [NOMBRE]</h2>
        <input pInputText id="documento" type="text" placeholder="Documento" formControlName="documento" />
        <p-password id="clave" formControlName="clave" [feedback]="false" autocomplete="off" placeholder="Clave" [toggleMask]="true"/>
        <p-button label="Iniciar sesión" (click)="iniciarSesion()"/>
    </div>
</form>
